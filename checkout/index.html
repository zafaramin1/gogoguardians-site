<!doctype html><html lang="en"><head><script src="/count.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - Gogo Guardians</title><meta name="robots" content="noindex">
<script>
// ONE place to set the store link. Every Buy button on the site and in the game comes here.
// If a partner sent the buyer (?p=<Payhip affiliate key>, here or remembered from any page in the last 60 days),
// the buyer goes to that partner's Payhip link so the sale is credited to them.
const STORE='https://payhip.com/b/cup6q';
let key='';
try{
  const q=new URLSearchParams(location.search).get('p');
  if(q&&/^[A-Za-z0-9_-]{3,40}$/.test(q)){key=q;localStorage.setItem('gogoPartner',JSON.stringify({k:q,t:Date.now()}));}
  else{const s=JSON.parse(localStorage.getItem('gogoPartner')||'null');if(s&&Date.now()-s.t<60*864e5)key=s.k;}
}catch(e){}
// No partner: straight to Payhip's checkout (skips the product page). Partner: keep Payhip's affiliate link so the sale is credited.
const URL_=key?STORE+'/'+encodeURIComponent(key):'https://payhip.com/buy?link=cup6q';
// Stripe checkout: off for buyers until it is tested. Testers open /checkout/?pay=stripe once (sticks in that browser; ?pay=payhip undoes it).
const STRIPE_ON=false;
let useStripe=STRIPE_ON;
try{const pq=new URLSearchParams(location.search).get('pay');if(pq==='stripe')localStorage.setItem('gg_pay','stripe');if(pq==='payhip')localStorage.removeItem('gg_pay');if(localStorage.getItem('gg_pay')==='stripe')useStripe=true;}catch(e){}
if(useStripe){
  fetch('https://script.google.com/macros/s/AKfycbwqA1VJG6I0bxBLmsr0cd_okIm-n9G5QW_BHgnLbP3xryLFGm_Zb5sAnifrgrNFGIWGjg/exec?stripe=create'+(key?'&p='+encodeURIComponent(key):''))
    .then(r=>r.json()).then(j=>location.replace(j.ok&&j.url?j.url:URL_)).catch(()=>location.replace(URL_));
}else goStore(URL_);
// Count "Begin checkout" in Google Ads (ad visitors only matter, but it is harmless for others), then go to the store.
// The store opens after Google confirms, or after 900 ms at most.
function goStore(u){var done=false;function go(){if(!done){done=true;location.replace(u)}}
 try{window.dataLayer=window.dataLayer||[];window.gtag=window.gtag||function(){dataLayer.push(arguments)};
  gtag('js',new Date());gtag('config','AW-18588125852');
  gtag('event','conversion',{send_to:'AW-18588125852/4313CJGyx70dEJyVwZ9F',event_callback:go});
  var t=document.createElement('script');t.async=true;t.src='https://www.googletagmanager.com/gtag/js?id=AW-18588125852';document.head.appendChild(t);
 }catch(e){}
 setTimeout(go,900);}
</script>

<body><div><h1>Gogo Guardians</h1><p class="p"><b><s>$14.95</s> $4.99</b> Black Friday only, today. Everything included</p><p>Taking you to the secure checkout...<br><a id="go" href="https://payhip.com/buy?link=cup6q">Tap here if it doesn't open</a></p><p><a href="/">Back to the site</a> &middot; <a href="/play/">Play free</a></p></div>
<script>document.getElementById('go').href=URL_;</script></body></html>
